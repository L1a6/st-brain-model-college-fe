name: Deployment Pipeline Staging
on:
  workflow_run:
    workflows: ["CI Pipeline Staging"]
    types:
      - completed
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEV_SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
      DEV_SERVER_USER: ${{ secrets.DEV_SERVER_USER }}
      DEV_SERVER_SSH_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Deploy on server
        if: ${{ env.DEV_SERVER_HOST != '' && env.DEV_SERVER_USER != '' && env.DEV_SERVER_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.DEV_SERVER_HOST }}
          username: ${{ env.DEV_SERVER_USER }}
          key: ${{ env.DEV_SERVER_SSH_KEY }}
          script: |
            # 1. Go to the frontend directory
            cd open-school/staging/open-school-portal-FE

            # 2. Extract the artifact
            tar -xzf /tmp/staging/open-school-portal-fe-artifact.tar.gz

            # 3. Remove the artifact file
            rm -f /tmp/staging/open-school-portal-fe-artifact.tar.gz

            # 4. Update packages/Dependencies
            corepack enable || true
            corepack prepare pnpm@9.15.4 --activate || true
            pnpm i

            # 5. Restart PM2 process using ecosystem config
            pm2 start ecosystem.config.cjs || pm2 restart osp-fe-staging --update-env
            pm2 save
